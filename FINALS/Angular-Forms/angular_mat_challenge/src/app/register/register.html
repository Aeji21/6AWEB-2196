<div [class.dark-mode]="isDarkMode" class="main-wrapper">
  <div class="container-inner">
    <mat-card class="styled-card">
      
      <div class="card-top-section">
        <div class="title-group">
          <mat-icon color="primary">event_available</mat-icon>
          <h2 class="card-title-text">Event Registration</h2>
        </div>
        <div class="toggle-group">
          <mat-icon class="mode-icon">{{ isDarkMode ? 'dark_mode' : 'light_mode' }}</mat-icon>
          <mat-slide-toggle (change)="toggleTheme()" color="warn"></mat-slide-toggle>
        </div>
      </div>

      <p class="subtitle">Join our 2026 Developer Summit</p>
      <mat-divider></mat-divider>

      <mat-card-content>
        <form [formGroup]="formdata" (ngSubmit)="onClickSubmit(formdata.value)">
          
          <mat-form-field appearance="outline" class="w-100 mt-20">
            <mat-label>Username</mat-label>
            <input matInput formControlName="userName">
          </mat-form-field>

          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Password</mat-label>
            <input matInput type="password" formControlName="password">
          </mat-form-field>

          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Birth Date (2006 or earlier)</mat-label>
            <input matInput [matDatepicker]="picker" formControlName="birthDate">
            <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
          </mat-form-field>

          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Preferred Interview Time</mat-label>
            <input matInput type="time" formControlName="eventTime">
            <mat-icon matSuffix>schedule</mat-icon>
          </mat-form-field>

          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Region</mat-label>
            <mat-select formControlName="country">
              <mat-option value="Philippines">Philippines</mat-option>
              <mat-option value="Global">Global</mat-option>
            </mat-select>
          </mat-form-field>

          <div class="row-section">
            <label class="hint-label">Skill Level: {{formdata.get('skillLevel')?.value}}</label>
            <mat-slider min="1" max="10" step="1" discrete color="primary">
              <input matSliderThumb formControlName="skillLevel">
            </mat-slider>
          </div>

          <div class="row-section gender-row">
            <mat-radio-group formControlName="gender">
              <mat-radio-button value="male" color="primary">Male</mat-radio-button>
              <mat-radio-button value="female" color="primary" style="margin-left: 15px;">Female</mat-radio-button>
            </mat-radio-group>
          </div>

          <div *ngIf="isLoading" class="loader-box">
             <mat-progress-spinner mode="indeterminate" diameter="35"></mat-progress-spinner>
          </div>

          <button mat-raised-button class="glow-button" type="submit" [disabled]="!formdata.valid || isLoading">
            {{ isLoading ? 'Processing...' : 'Complete Registration' }}
          </button>

        </form>
      </mat-card-content>
      
      <mat-card-footer *ngIf="submitted && !isLoading" class="success-banner">
        Welcome aboard, {{ userName }}! Check your email.
      </mat-card-footer>
    </mat-card>
  </div>
</div>
