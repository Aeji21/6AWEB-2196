<div class="page-wrapper">
  <div class="card">

    <h3 class="form-title">Job Application Form</h3>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">

      <input class="input" placeholder="Full Name" formControlName="fullname" />
      @if (isInvalid('fullname')) {
        <small class="error">Full name required</small>
      }

      <input class="input" placeholder="Phone (11 digits)" formControlName="phone" />
      @if (isInvalid('phone')) {
        <small class="error">Valid 11-digit phone required</small>
      }

      <input class="input" placeholder="Position Applied" formControlName="position" />
      @if (isInvalid('position')) {
        <small class="error">Position required</small>
      }

      <select class="input" formControlName="experience">
        <option value="">Select Experience</option>
        <option>1-2 years</option>
        <option>3-5 years</option>
        <option>5+ years</option>
      </select>
      @if (isInvalid('experience')) {
        <small class="error">Select experience</small>
      }

      <input class="input" type="number" placeholder="Expected Salary" formControlName="expectedSalary" />
      @if (isInvalid('expectedSalary')) {
        <small class="error">Minimum salary 10,000</small>
      }

      <button class="btn" type="submit" [disabled]="form.invalid">
        Submit Application
      </button>

    </form>

  </div>
</div>
