<mat-toolbar color="primary" class="header-nav">
  <mat-icon>assignment_ind</mat-icon>
  <span>Developer Registration</span>
</mat-toolbar>

<div class="form-container">
  <mat-card class="register-card">
    <mat-card-header>
      <mat-card-title>Create Your Profile</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="formdata" (ngSubmit)="onClickSubmit(formdata.value)">
        
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Username</mat-label>
          <input matInput formControlName="userName">
          <mat-icon matSuffix>person</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email Address</mat-label>
          <input matInput type="email" formControlName="email">
          <mat-icon matSuffix>email</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Country</mat-label>
          <mat-select formControlName="country">
            <mat-option value="Philippines">Philippines</mat-option>
            <mat-option value="USA">USA</mat-option>
            <mat-option value="Japan">Japan</mat-option>
          </mat-select>
        </mat-form-field>

        <div class="custom-section">
          <label class="section-label">Gender</label>
          <mat-radio-group formControlName="gender">
            <mat-radio-button value="male" color="primary">Male</mat-radio-button>
            <mat-radio-button value="female" color="primary">Female</mat-radio-button>
          </mat-radio-group>
        </div>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Birth Date</mat-label>
          <input matInput [matDatepicker]="picker" formControlName="birthDate">
          <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>

        <div class="custom-section">
          <label class="section-label">Skill Level: {{formdata.get('skillLevel')?.value}}</label>
          <mat-slider min="1" max="10" step="1" discrete color="primary">
            <input matSliderThumb formControlName="skillLevel">
          </mat-slider>
        </div>

        <div class="custom-section">
          <mat-slide-toggle formControlName="notifications" color="primary">
            Enable Email Alerts
          </mat-slide-toggle>
        </div>

        <div *ngIf="isLoading" class="spinner-wrapper">
          <mat-progress-spinner mode="indeterminate" diameter="40"></mat-progress-spinner>
        </div>

        <button mat-raised-button class="submit-btn" type="submit" [disabled]="!formdata.valid || isLoading">
          {{ isLoading ? 'REGISTERING...' : 'SUBMIT REGISTRATION' }}
        </button>

      </form>
    </mat-card-content>

    <mat-card-footer *ngIf="submitted && !isLoading" class="success-msg">
      <mat-icon>check_circle</mat-icon> Welcome, {{ userName }}!
    </mat-card-footer>
  </mat-card>
</div>
